<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  
  <!-- Icon: Signal C -->
  <g>
    <!-- Outer C ring -->
    <path 
      d="M 24 8 A 16 16 0 1 0 24 40" 
      stroke="url(#logoGradient)" 
      stroke-width="6" 
      stroke-linecap="round" 
      fill="none"
    />
    <!-- Inner signal dots -->
    <circle cx="24" cy="24" r="3" fill="url(#logoGradient)"/>
    <circle cx="32" cy="16" r="2" fill="url(#logoGradient)" opacity="0.7"/>
    <circle cx="32" cy="32" r="2" fill="url(#logoGradient)" opacity="0.7"/>
  </g>
  
  <!-- Text: CRM -->
  <text 
    x="56" 
    y="32" 
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
    font-size="22" 
    font-weight="700" 
    fill="#1E293B"
    letter-spacing="-0.5"
  >CRM</text>
</svg>